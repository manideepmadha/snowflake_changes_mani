name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sonarqube-analysis:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonar
          POSTGRES_DB: sonarqube
        ports:
          - 5432:5432

      sonarqube:
        image: sonarqube:community
        ports:
          - 9001:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --env sonar.jdbc.username=sonar
          --env sonar.jdbc.password=sonar
          --env sonar.jdbc.url=jdbc:postgresql://postgres/sonarqube
          --memory=2g
          --cpus=2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Wait for SonarQube to Start
        run: |
          echo "Waiting for SonarQube to be ready..."
          for i in {1..30}; do
            curl -s http://localhost:9001/api/system/health | grep -q '"status":"GREEN"' && break
            sleep 5
          done

      - name: Install SonarScanner
        run: |
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip sonar-scanner-cli-4.8.0.2856-linux.zip -d $HOME
          echo "$HOME/sonar-scanner-4.8.0.2856-linux/bin" >> $GITHUB_PATH

      - name: Run SonarScanner
        run: |
          sonar-scanner \
            -Dsonar.projectKey=my-project \
            -Dsonar.host.url=http://localhost:9001 \
            -Dsonar.login=admin \
            -Dsonar.password=admin \
            -Dsonar.verbose=true

      - name: Upload SonarQube Reports
        uses: actions/upload-artifact@v3
        with:
          name: sonarqube-reports
          path: .scannerwork/
